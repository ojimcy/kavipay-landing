<svg width="375" height="812" viewBox="0 0 375 812" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="375" height="812" fill="#0A0A1A"/>
  <!-- Status bar -->
  <text x="24" y="56" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" opacity="0.7">9:41</text>
  <rect x="306" y="44" width="25" height="12" rx="3" fill="white" opacity="0.7"/>
  <rect x="307" y="45" width="20" height="10" rx="2" fill="#10B981"/>

  <!-- Header with back button -->
  <text x="50" y="108" fill="white" font-family="Inter, system-ui, sans-serif" font-size="13" opacity="0.5">←</text>
  <text x="160" y="108" fill="white" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Pay Utility</text>

  <!-- Category tabs -->
  <rect x="20" y="130" width="80" height="36" rx="18" fill="#6366F1"/>
  <text x="60" y="153" fill="white" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Airtime</text>

  <rect x="108" y="130" width="64" height="36" rx="18" fill="#1A1A2E"/>
  <text x="140" y="153" fill="white" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle" opacity="0.6">Data</text>

  <rect x="180" y="130" width="88" height="36" rx="18" fill="#1A1A2E"/>
  <text x="224" y="153" fill="white" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle" opacity="0.6">Electricity</text>

  <rect x="276" y="130" width="52" height="36" rx="18" fill="#1A1A2E"/>
  <text x="302" y="153" fill="white" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle" opacity="0.6">TV</text>

  <!-- Provider selection -->
  <text x="24" y="210" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Select Provider</text>

  <rect x="20" y="228" width="78" height="78" rx="16" fill="#1A1A2E"/>
  <circle cx="59" cy="252" r="20" fill="#E10A0A" opacity="0.2"/>
  <text x="59" y="258" fill="#FF4444" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">A</text>
  <text x="59" y="290" fill="white" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle" opacity="0.7">Airtel</text>

  <rect x="108" y="228" width="78" height="78" rx="16" fill="#1A1A2E" stroke="#6366F1" stroke-width="2"/>
  <circle cx="147" cy="252" r="20" fill="#009900" opacity="0.2"/>
  <text x="147" y="258" fill="#00CC00" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">G</text>
  <text x="147" y="290" fill="white" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle" opacity="0.7">Glo</text>

  <rect x="196" y="228" width="78" height="78" rx="16" fill="#1A1A2E"/>
  <circle cx="235" cy="252" r="20" fill="#FFCC00" opacity="0.2"/>
  <text x="235" y="258" fill="#FFD700" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">M</text>
  <text x="235" y="290" fill="white" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle" opacity="0.7">MTN</text>

  <rect x="284" y="228" width="78" height="78" rx="16" fill="#1A1A2E"/>
  <circle cx="323" cy="252" r="20" fill="#0066CC" opacity="0.2"/>
  <text x="323" y="258" fill="#3399FF" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">9</text>
  <text x="323" y="290" fill="white" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle" opacity="0.7">9mobile</text>

  <!-- Phone number input -->
  <text x="24" y="350" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Phone Number</text>
  <rect x="20" y="366" width="335" height="56" rx="14" fill="#1A1A2E"/>
  <text x="44" y="400" fill="white" font-family="Inter, system-ui, sans-serif" font-size="16" opacity="0.3">Enter phone number</text>

  <!-- Amount -->
  <text x="24" y="462" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Amount</text>

  <rect x="20" y="478" width="78" height="44" rx="12" fill="#1A1A2E"/>
  <text x="59" y="506" fill="white" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle" opacity="0.7">₦100</text>

  <rect x="108" y="478" width="78" height="44" rx="12" fill="#1A1A2E"/>
  <text x="147" y="506" fill="white" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle" opacity="0.7">₦200</text>

  <rect x="196" y="478" width="78" height="44" rx="12" fill="#6366F1"/>
  <text x="235" y="506" fill="white" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">₦500</text>

  <rect x="284" y="478" width="78" height="44" rx="12" fill="#1A1A2E"/>
  <text x="323" y="506" fill="white" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle" opacity="0.7">₦1000</text>

  <!-- Custom amount -->
  <rect x="20" y="536" width="335" height="56" rx="14" fill="#1A1A2E"/>
  <text x="44" y="570" fill="white" font-family="Inter, system-ui, sans-serif" font-size="16" opacity="0.3">Or enter custom amount</text>

  <!-- Payment summary -->
  <rect x="20" y="620" width="335" height="100" rx="16" fill="#1A1A2E"/>
  <text x="44" y="652" fill="white" font-family="Inter, system-ui, sans-serif" font-size="12" opacity="0.5">You'll pay</text>
  <text x="332" y="652" fill="white" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end" opacity="0.5">Fee: ₦0</text>
  <text x="44" y="694" fill="white" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800">₦500.00</text>

  <!-- CTA Button -->
  <rect x="20" y="740" width="335" height="52" rx="16" fill="url(#ctaGrad)"/>
  <text x="188" y="772" fill="white" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Buy Airtime</text>

  <!-- Bottom nav -->
  <rect x="130" y="800" width="115" height="5" rx="2.5" fill="white" opacity="0.3"/>

  <defs>
    <linearGradient id="ctaGrad" x1="20" y1="740" x2="355" y2="792" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
</svg>