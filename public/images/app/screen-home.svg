  <text x="24" y="534" fill="white" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">Recent Transactions</text>
  <text x="310" y="534" fill="#818CF8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500">See all</text>

  <!-- Transaction 1 -->
  <rect x="20" y="554" width="335" height="64" rx="14" fill="#1A1A2E"/>
  <circle cx="52" cy="586" r="18" fill="#10B981" opacity="0.15"/>
  <text x="52" y="591" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">N</text>
  <text x="82" y="580" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Netflix</text>
  <text x="82" y="598" fill="white" font-family="Inter, system-ui, sans-serif" font-size="11" opacity="0.5">Today, 2:30 PM</text>
  <text x="332" y="586" fill="#EF4444" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">-$15.99</text>

  <!-- Transaction 2 -->
  <rect x="20" y="626" width="335" height="64" rx="14" fill="#1A1A2E"/>
  <circle cx="52" cy="658" r="18" fill="#6366F1" opacity="0.15"/>
  <text x="52" y="663" fill="#818CF8" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">S</text>
  <text x="82" y="652" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Spotify</text>
  <text x="82" y="670" fill="white" font-family="Inter, system-ui, sans-serif" font-size="11" opacity="0.5">Yesterday</text>
  <text x="332" y="658" fill="#EF4444" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">-$9.99</text>

  <!-- Transaction 3 -->
  <rect x="20" y="698" width="335" height="64" rx="14" fill="#1A1A2E"/>
  <circle cx="52" cy="730" r="18" fill="#F59E0B" opacity="0.15"/>
  <text x="52" y="735" fill="#FBBF24" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">T</text>
  <text x="82" y="724" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Top Up</text>
  <text x="82" y="742" fill="white" font-family="Inter, system-ui, sans-serif" font-size="11" opacity="0.5">Feb 22</text>
  <text x="332" y="730" fill="#10B981" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">+$500.00</text>

  <!-- Bottom nav bar -->
  <rect x="0" y="770" width="375" height="42" fill="#0A0A1A"/>
  <rect x="130" y="800" width="115" height="5" rx="2.5" fill="white" opacity="0.3"/>

  <defs>
    <linearGradient id="cardGrad" x1="20" y1="164" x2="355" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="cardOverlay" x1="200" y1="164" x2="200" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="323" y1="98" x2="363" y2="138" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
</svg>