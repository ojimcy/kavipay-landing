<svg width="375" height="812" viewBox="0 0 375 812" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="375" height="812" fill="#0A0A1A"/>
  <!-- Status bar -->
  <text x="24" y="56" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" opacity="0.7">9:41</text>
  <rect x="306" y="44" width="25" height="12" rx="3" fill="white" opacity="0.7"/>
  <rect x="307" y="45" width="20" height="10" rx="2" fill="#10B981"/>

  <!-- App header -->
  <text x="24" y="108" fill="white" font-family="Inter, system-ui, sans-serif" font-size="13" opacity="0.5">Welcome back</text>
  <text x="24" y="134" fill="white" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">Dashboard</text>
  <circle cx="343" cy="118" r="20" fill="url(#avatarGrad)"/>
  <text x="343" y="124" fill="white" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">K</text>

  <!-- Balance card -->
  <rect x="20" y="164" width="335" height="180" rx="20" fill="url(#cardGrad)"/>
  <rect x="20" y="164" width="335" height="180" rx="20" fill="url(#cardOverlay)" opacity="0.1"/>
  <circle cx="300" cy="200" r="60" fill="white" opacity="0.05"/>
  <circle cx="80" cy="310" r="50" fill="white" opacity="0.04"/>

  <text x="44" y="200" fill="white" font-family="Inter, system-ui, sans-serif" font-size="12" opacity="0.7" letter-spacing="2">AVAILABLE BALANCE</text>
  <text x="44" y="248" fill="white" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="800">$4,820</text>
  <text x="210" y="248" fill="white" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" opacity="0.6">.50</text>

  <text x="44" y="290" fill="white" font-family="Inter, system-ui, sans-serif" font-size="11" opacity="0.5">KAVIPAY</text>
  <text x="44" y="318" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="3">•••• •••• •••• 8642</text>
  <text x="280" y="318" fill="white" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" font-style="italic">VISA</text>

  <!-- Quick Actions -->
  <text x="24" y="390" fill="white" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">Quick Actions</text>

  <rect x="20" y="410" width="78" height="78" rx="16" fill="#1A1A2E"/>
  <circle cx="59" cy="438" r="16" fill="#6366F1" opacity="0.2"/>
  <text x="59" y="443" fill="#818CF8" font-family="Inter, system-ui, sans-serif" font-size="16" text-anchor="middle">↑</text>
  <text x="59" y="475" fill="white" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle" opacity="0.7">Send</text>

  <rect x="108" y="410" width="78" height="78" rx="16" fill="#1A1A2E"/>
  <circle cx="147" cy="438" r="16" fill="#10B981" opacity="0.2"/>
  <text x="147" y="443" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="16" text-anchor="middle">+</text>
  <text x="147" y="475" fill="white" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle" opacity="0.7">Top Up</text>

  <rect x="196" y="410" width="78" height="78" rx="16" fill="#1A1A2E"/>
  <circle cx="235" cy="438" r="16" fill="#F59E0B" opacity="0.2"/>
  <text x="235" y="443" fill="#FBBF24" font-family="Inter, system-ui, sans-serif" font-size="16" text-anchor="middle">↓</text>
  <text x="235" y="475" fill="white" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle" opacity="0.7">Request</text>

  <rect x="284" y="410" width="78" height="78" rx="16" fill="#1A1A2E"/>
  <circle cx="323" cy="438" r="16" fill="#EC4899" opacity="0.2"/>
  <text x="323" y="443" fill="#F472B6" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">⚡</text>
  <text x="323" y="475" fill="white" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle" opacity="0.7">Pay Bills</text>

