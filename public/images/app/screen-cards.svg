<svg width="375" height="812" viewBox="0 0 375 812" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="375" height="812" fill="#0A0A1A"/>
  <!-- Status bar -->
  <text x="24" y="56" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" opacity="0.7">9:41</text>
  <rect x="306" y="44" width="25" height="12" rx="3" fill="white" opacity="0.7"/>
  <rect x="307" y="45" width="20" height="10" rx="2" fill="#10B981"/>

  <!-- Header -->
  <text x="24" y="108" fill="white" font-family="Inter, system-ui, sans-serif" font-size="13" opacity="0.5">Manage</text>
  <text x="24" y="134" fill="white" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">My Cards</text>
  <rect x="298" y="104" width="56" height="30" rx="15" fill="#6366F1" opacity="0.2"/>
  <text x="326" y="124" fill="#818CF8" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ New</text>

  <!-- Primary Card -->
  <rect x="20" y="164" width="335" height="200" rx="20" fill="url(#primaryCard)"/>
  <circle cx="310" cy="200" r="70" fill="white" opacity="0.04"/>
  <circle cx="70" cy="330" r="55" fill="white" opacity="0.03"/>

  <text x="44" y="200" fill="white" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="3" opacity="0.9">KAVIPAY</text>

  <!-- Chip -->
  <rect x="44" y="218" width="42" height="32" rx="6" fill="url(#chip)"/>
  <rect x="48" y="228" width="34" height="12" rx="3" fill="#D4A017" opacity="0.4"/>

  <text x="44" y="290" fill="white" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500" letter-spacing="4">4532 •••• •••• 8642</text>

  <text x="44" y="324" fill="white" font-family="Inter, system-ui, sans-serif" font-size="10" opacity="0.5" letter-spacing="1">CARDHOLDER</text>
  <text x="44" y="344" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">John Doe</text>

  <text x="180" y="324" fill="white" font-family="Inter, system-ui, sans-serif" font-size="10" opacity="0.5" letter-spacing="1">EXPIRES</text>
  <text x="180" y="344" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">12/28</text>

  <text x="290" y="344" fill="white" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" font-style="italic">VISA</text>

  <!-- Card controls -->
  <rect x="20" y="384" width="160" height="52" rx="14" fill="#1A1A2E"/>
  <text x="100" y="415" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🔒 Freeze Card</text>

  <rect x="195" y="384" width="160" height="52" rx="14" fill="#1A1A2E"/>
  <text x="275" y="415" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">⚙️ Settings</text>

  <!-- Card Details -->
  <text x="24" y="478" fill="white" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">Card Details</text>

  <rect x="20" y="498" width="335" height="56" rx="14" fill="#1A1A2E"/>
  <text x="44" y="530" fill="white" font-family="Inter, system-ui, sans-serif" font-size="13" opacity="0.5">Card Type</text>
  <text x="332" y="530" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">Virtual Card</text>

  <rect x="20" y="562" width="335" height="56" rx="14" fill="#1A1A2E"/>
  <text x="44" y="594" fill="white" font-family="Inter, system-ui, sans-serif" font-size="13" opacity="0.5">Currency</text>
  <text x="332" y="594" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">USD ($)</text>

  <rect x="20" y="626" width="335" height="56" rx="14" fill="#1A1A2E"/>
  <text x="44" y="658" fill="white" font-family="Inter, system-ui, sans-serif" font-size="13" opacity="0.5">Status</text>
  <rect x="296" y="641" width="56" height="24" rx="12" fill="#10B981" opacity="0.2"/>
  <text x="324" y="658" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Active</text>

  <rect x="20" y="690" width="335" height="56" rx="14" fill="#1A1A2E"/>
  <text x="44" y="722" fill="white" font-family="Inter, system-ui, sans-serif" font-size="13" opacity="0.5">Spending Limit</text>
  <text x="332" y="722" fill="white" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">$10,000/mo</text>

  <!-- Bottom nav -->
  <rect x="0" y="770" width="375" height="42" fill="#0A0A1A"/>
  <rect x="130" y="800" width="115" height="5" rx="2.5" fill="white" opacity="0.3"/>

  <defs>
    <linearGradient id="primaryCard" x1="20" y1="164" x2="355" y2="364" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="chip" x1="44" y1="218" x2="86" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5D061"/>
      <stop offset="1" stop-color="#D4A017"/>
    </linearGradient>
  </defs>
</svg>